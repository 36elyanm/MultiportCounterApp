<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Multiport Counter</title>
<meta name="description" content="Multiport Counter — a fast, simple tally counter app by Multiport LLC." />

<!-- Apple / iOS web-app meta -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Counter" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.json" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
<div id="app">

  <div class="app-scroll">
    <!-- Nav Bar -->
    <header class="navbar">
      <div class="navbar-inner">
        <button id="editBtn" class="nav-btn" aria-label="Edit counters">Edit</button>
        <h1 class="navbar-title">Counters</h1>
        <button id="settingsBtn" class="nav-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.94 3.5a7.4 7.4 0 00-.09-1.15l1.9-1.48a.45.45 0 00.1-.58l-1.8-3.12a.45.45 0 00-.55-.2l-2.24.9a7.6 7.6 0 00-2-1.15l-.34-2.38A.45.45 0 0015.4 2h-3.6a.45.45 0 00-.44.38l-.34 2.38a7.6 7.6 0 00-2 1.15l-2.24-.9a.45.45 0 00-.55.2L4.44 8.33a.45.45 0 00.1.58l1.9 1.48a7.4 7.4 0 000 2.3l-1.9 1.5a.45.45 0 00-.1.58l1.8 3.12c.12.2.36.28.55.2l2.24-.9c.6.48 1.27.87 2 1.15l.34 2.38c.04.22.23.38.44.38h3.6c.21 0 .4-.16.44-.38l.34-2.38a7.6 7.6 0 002-1.15l2.24.9c.2.08.43 0 .55-.2l1.8-3.12a.45.45 0 00-.1-.58l-1.9-1.5c.06-.37.09-.76.09-1.15z"/></svg>
        </button>
      </div>
      <h2 class="navbar-large-title">Counters</h2>
    </header>

    <!-- Counter List -->
    <main id="counterList" class="counter-list"></main>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">＋</div>
      <p class="empty-title">No Counters Yet</p>
      <p class="empty-sub">Tap the button below to add your first tally.</p>
    </div>

    <p class="footer-credit">Made by Multiport LLC</p>
  </div>

  <!-- Floating Add Button -->
  <button id="addBtn" class="fab" aria-label="Add counter">
    <svg viewBox="0 0 24 24" class="icon"><path d="M12 4v16m8-8H4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <!-- Add / Edit Counter Sheet -->
  <div id="sheetOverlay" class="sheet-overlay">
    <div id="counterSheet" class="sheet">
      <div class="sheet-grabber"></div>
      <h3 id="sheetTitle" class="sheet-title">New Counter</h3>

      <input id="counterNameInput" class="text-field" type="text" placeholder="Name" maxlength="30" autocomplete="off" />

      <label class="field-label">Step</label>
      <div class="step-picker" id="stepPicker">
        <button class="step-chip" data-step="1">1</button>
        <button class="step-chip" data-step="5">5</button>
        <button class="step-chip" data-step="10">10</button>
        <button class="step-chip" data-step="100">100</button>
      </div>

      <label class="field-label">Color</label>
      <div class="color-picker" id="colorPicker"></div>

      <button id="deleteCounterBtn" class="sheet-delete-btn">Delete Counter</button>
      <button id="saveCounterBtn" class="sheet-save-btn">Save</button>
    </div>
  </div>

  <!-- Settings Sheet -->
  <div id="settingsOverlay" class="sheet-overlay">
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <h3 class="sheet-title">Settings</h3>

      <div class="settings-row">
        <span>Haptic Feedback</span>
        <label class="switch">
          <input type="checkbox" id="hapticsToggle" checked />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>

      <button id="resetAllBtn" class="sheet-action-btn">Reset All Counts</button>
      <button id="deleteAllBtn" class="sheet-action-btn destructive">Delete All Counters</button>

      <div class="about-block">
        <p class="about-name">Multiport Counter</p>
        <p class="about-version">Version 1.0.0</p>
        <p class="about-credit">Made by Multiport LLC</p>
      </div>

      <button id="closeSettingsBtn" class="sheet-cancel-btn">Done</button>
    </div>
  </div>

</div>
</div>

<script src="js/app.js"></script>
</body>
</html>
