name = "multiport-counter-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Filled in automatically by `wrangler d1 create multiport-counter-db`,
# or set it by hand if the database already exists.
[[d1_databases]]
binding = "DB"
database_name = "multiport-counter-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Frontend origin allowed to call this API with credentials (cookies).
# Wildcard "*" cannot be used together with credentialed requests.
ALLOWED_ORIGIN = "http://localhost:8080"
