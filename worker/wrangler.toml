name = "multiport-counter-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Filled in automatically by `wrangler d1 create multiport-counter-db`,
# or set it by hand if the database already exists.
[[d1_databases]]
binding = "DB"
database_name = "multiport-counter-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Comma-separated list of frontend origins allowed to call this API with
# credentials (cookies). Wildcard "*" cannot be used together with
# credentialed requests, so every real origin that will use this API
# needs to be listed explicitly — including both the Pages URL and the
# eventual custom domain, side by side during the migration.
ALLOWED_ORIGINS = "https://multiportcounterapp.pages.dev,https://counterapp.multiportllc.com,http://localhost:8080"
